server:
  port: 9090

spring:
  application:
    name: api-gateway

  config:
    import: optional:configserver:http://localhost:8888

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**


        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**

        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/transactions/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
              - Path=/api/customers/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"


jwt:
  secret: MyVerySecureBankingJWTSecretKeyForDevelopment2026


logging:
  level:
    org.springframework.cloud.gateway: DEBUG